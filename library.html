<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — Droplay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121212;
      color: #fff;
      padding-bottom: 140px;
    }

    .top-bar {
      position: sticky; top: 0; z-index: 20;
      background: #121212;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 16px 14px;
      border-bottom: 1px solid #181818;
    }
    .top-bar h1 { font-size: 20px; font-weight: 800; }
    .count-pill {
      background: #1f1f1f; color: #b3b3b3;
      font-size: 11px; font-weight: 700;
      padding: 5px 10px; border-radius: 999px;
    }

    .section { padding: 18px 16px; }

    .lib-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px; border-radius: 10px;
      margin-bottom: 8px; cursor: pointer;
      transition: background 0.2s;
    }
    .lib-item:hover, .lib-item.active { background: #1a1a1a; }
    .lib-cover {
      width: 60px; height: 60px; border-radius: 8px;
      object-fit: cover; background: #333; flex-shrink: 0;
    }
    .lib-info { flex: 1; min-width: 0; }
    .lib-title {
      font-weight: 700; font-size: 15px; margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lib-artist {
      font-size: 13px; color: #b3b3b3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .remove-btn {
      background: none; border: none; padding: 8px;
      cursor: pointer; border-radius: 50%; flex-shrink: 0;
    }
    .remove-btn svg { width: 20px; height: 20px; fill: #888; }
    .remove-btn:hover svg { fill: #e91e63; }

    .mini-player {
      position: fixed; bottom: 68px; left: 0; right: 0;
      background: linear-gradient(180deg, #1f1f1f 0%, #1a1a1a 100%);
      border-top: 1px solid #282828;
      padding: 10px 14px; display: flex;
      align-items: center; gap: 12px;
      z-index: 90;
    }
    .mini-player-cover {
      width: 46px; height: 46px; border-radius: 8px;
      object-fit: cover; background: #333;
    }
    .mini-player-info { flex: 1; min-width: 0; }
    .mini-player-title {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-player-artist {
      font-size: 11px; color: #b3b3b3; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-play-btn {
      background: #fff; border: none;
      width: 42px; height: 42px; border-radius: 50%;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center; padding: 0;
    }
    .mini-play-btn svg { width: 18px; height: 18px; fill: #000; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 68px; background: #121212;
      border-top: 1px solid #181818;
      display: flex; justify-content: space-around;
      align-items: center; z-index: 100;
    }
    .bottom-nav a {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      text-decoration: none; color: #888;
      font-size: 10px; font-weight: 500;
    }
    .bottom-nav a.active { color: #fff; }
    .bottom-nav svg { width: 22px; height: 22px; fill: currentColor; }

    .empty {
      text-align: center; padding: 60px 24px; color: #666;
      font-size: 14px; line-height: 1.6;
    }
    .empty a { color: #e91e63; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>

  <header class="top-bar">
    <h1>Your Library</h1>
    <span class="count-pill" id="count-pill">0 songs</span>
  </header>

  <section class="section">
    <div id="lib-list"></div>
  </section>

  <div class="mini-player" id="mini-player">
    <img class="mini-player-cover" id="player-cover"
         src="https://via.placeholder.com/46/333/fff?text=♪" alt="">
    <div class="mini-player-info">
      <div class="mini-player-title" id="player-title">No track playing</div>
      <div class="mini-player-artist" id="player-artist">—</div>
    </div>
    <button class="mini-play-btn" id="play-btn" aria-label="Play">
      <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <nav class="bottom-nav">
    <a href="index.html">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
      Home
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.29 14.01l4.35 4.35 1.41-1.41-4.35-4.35A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
      Search
    </a>
    <a href="library.html" class="active">
      <svg viewBox="0 0 24 24"><path d="M4 4h5v2H6v12h3v2H4V4zm11 0h5v16h-5v-2h3V6h-3V4z"/></svg>
      Library
    </a>
    <a href="studio.html">
      <svg viewBox="0 0 24 24"><path d="M12 2l2 7h7l-5.5 4.5 2 7L12 16l-5.5 4.5 2-7L3 9h7z"/></svg>
      Studio
    </a>
  </nav>

  <audio id="audio" preload="metadata"></audio>

  <script>
    const FALLBACK = 'https://via.placeholder.com/60/333/fff?text=♪';
    const PLAY_SVG  = '<path d="M8 5v14l11-7z"/>';
    const PAUSE_SVG = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

    const libList    = document.getElementById('lib-list');
    const countPill  = document.getElementById('count-pill');
    const audioEl    = document.getElementById('audio');
    const playBtn    = document.getElementById('play-btn');
    const playIcon   = document.getElementById('play-icon');
    const playerCover  = document.getElementById('player-cover');
    const playerTitle  = document.getElementById('player-title');
    const playerArtist = document.getElementById('player-artist');

    let isPlaying = false;
    let currentId = null;

    function getLibrary() {
      try { return JSON.parse(localStorage.getItem('droplay_downloads') || '[]'); }
      catch (e) { return []; }
    }
    function saveLibrary(list) {
      localStorage.setItem('droplay_downloads', JSON.stringify(list));
    }
    function setPlayIcon(playing) {
      playIcon.innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
    }

    function render() {
      const list = getLibrary();
      countPill.textContent = list.length + (list.length === 1 ? ' song' : ' songs');

      if (list.length === 0) {
        libList.innerHTML = `
          <div class="empty">
            🎵 Nothing saved yet.<br><br>
            Find songs you like on the <a href="index.html">Home</a> tab<br>
            and tap ⋮ → <b>Download</b> to save them here.
          </div>`;
        return;
      }

      libList.innerHTML = '';

      list.forEach(track => {
        const cover = track.cover_url || FALLBACK;

        const el = document.createElement('div');
        el.className = 'lib-item';
        if (track.id === currentId) el.classList.add('active');
        el.dataset.id = track.id;

        // Build safely — no innerHTML on user-controlled text
        const img = document.createElement('img');
        img.className = 'lib-cover';
        img.src = cover;
        img.onerror = () => { img.src = FALLBACK; };
        img.alt = '';

        const info = document.createElement('div');
        info.className = 'lib-info';

        const title = document.createElement('div');
        title.className = 'lib-title';
        title.textContent = track.title || 'Untitled';

        const artist = document.createElement('div');
        artist.className = 'lib-artist';
        artist.textContent = track.artist_name || 'Unknown Artist';

        info.appendChild(title);
        info.appendChild(artist);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.setAttribute('aria-label', 'Remove from library');
        removeBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';

        removeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!confirm('Remove "' + (track.title || 'this song') + '" from your library?')) return;
          const updated = getLibrary().filter(t => t.id !== track.id);
          saveLibrary(updated);
          render();
        });

        el.appendChild(img);
        el.appendChild(info);
        el.appendChild(removeBtn);
        el.addEventListener('click', () => playTrack(track, el));

        libList.appendChild(el);
      });
    }

    function playTrack(track, el) {
      if (!track.audio_url) { alert('This track has no audio file.'); return; }

      document.querySelectorAll('.lib-item').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');

      currentId = track.id;
      audioEl.src = track.audio_url;

      audioEl.play()
        .then(() => { isPlaying = true; setPlayIcon(true); })
        .catch(err => {
          console.error('Play failed:', err);
          isPlaying = false; setPlayIcon(false);
          alert('Could not play this track. It may have been removed.');
        });

      const cover = track.cover_url || FALLBACK;
      playerCover.src = cover;
      playerCover.onerror = () => { playerCover.src = FALLBACK; };
      playerTitle.textContent  = track.title || 'Untitled';
      playerArtist.textContent = track.artist_name || 'Unknown Artist';
    }

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!currentId) return;
      if (isPlaying) {
        audioEl.pause();
        isPlaying = false; setPlayIcon(false);
      } else {
        audioEl.play()
          .then(() => { isPlaying = true; setPlayIcon(true); })
          .catch(() => {});
      }
    });

    audioEl.addEventListener('ended', () => {
      isPlaying = false; setPlayIcon(false);
    });

    render();
  </script>
</body>
</html>
