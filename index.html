<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropplay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; } html { background: #121212; min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121212;
      color: #fff;
      padding-bottom: 140px;
    }

    .top-tabs {
      position: sticky; top: 0; z-index: 20;
      background: #121212;
      display: flex; gap: 22px;
      padding: 18px 16px 14px;
      overflow-x: auto; scrollbar-width: none;
      border-bottom: 1px solid #181818;
    }
    .top-tabs::-webkit-scrollbar { display: none; }
    .top-tabs a {
      color: #999; text-decoration: none;
      font-weight: 700; white-space: nowrap;
      font-size: 16px; padding-bottom: 6px;
      border-bottom: 2px solid transparent;
    }
    .top-tabs a.active { color: #fff; border-bottom-color: #e91e63; }

    .section { padding: 20px 16px; }
    .section h2 {
      font-size: 10px; margin-bottom: 10px;
      font-weight: 600; letter-spacing: 1.2px;
      text-transform: uppercase; color: #888;
    }
    .section-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }
    .refresh-btn {
      background: #1f1f1f; border: none; color: #fff;
      padding: 6px 12px; border-radius: 999px;
      font-size: 11px; font-weight: 700; cursor: pointer;
    }

    .track {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 10px; 
  border-bottom: 1px solid #3a3a3a; /* This adds the line */
  cursor: pointer;
  transition: background 0.2s;
}
.track:last-child { border-bottom: none; } /* Removes line from the very last song */
.track:hover, .track.active { background: #1a1a1a; }
.track { padding: 6px 10px; }
    .track-cover {
      width: 60px; height: 60px; border-radius: 8px;
      object-fit: cover; background: #333; flex-shrink: 0;
    }
    .track-info { flex: 1; min-width: 0; }
    .track-title {
      font-weight: 700; font-size: 15px; margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 13px; color: #b3b3b3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-menu-btn {
      background: none; border: none; padding: 6px;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
    }
    .track-menu-btn svg { width: 22px; height: 22px; fill: #b3b3b3; }

    .mini-player {
      position: fixed; bottom: 68px; left: 0; right: 0;
      background: linear-gradient(180deg, #1f1f1f 0%, #1a1a1a 100%);
      border-top: 1px solid #282828;
      padding: 10px 14px; display: flex;
      align-items: center; gap: 12px;
      z-index: 90; cursor: pointer;
    }
    .mini-player-cover {
      width: 46px; height: 46px; border-radius: 8px;
      object-fit: cover; background: #333;
    }
    .mini-player-info { flex: 1; min-width: 0; }
    .mini-player-title {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-player-artist {
      font-size: 11px; color: #b3b3b3; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-play-btn {
      background: #fff; border: none;
      width: 42px; height: 42px; border-radius: 50%;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center; padding: 0;
    }
    .mini-play-btn svg { width: 18px; height: 18px; fill: #000; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 68px; background: #121212;
      border-top: 1px solid #181818;
      display: flex; justify-content: space-around;
      align-items: center; z-index: 100;
    }
    .bottom-nav a {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      text-decoration: none; color: #888;
      font-size: 10px; font-weight: 500;
      cursor: pointer;
    }
    .bottom-nav a.active { color: #fff; }
    .bottom-nav svg { width: 22px; height: 22px; fill: currentColor; }

    .loading, .empty {
      text-align: center; padding: 40px 20px; color: #666;
    }

    .sheet-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 900;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

    .song-sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #1a1a1a;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 8px 16px 28px; z-index: 950;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .song-sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 40px; height: 4px; background: #444;
      border-radius: 999px; margin: 6px auto 16px;
    }
    .sheet-header {
      display: flex; gap: 12px; align-items: center;
      padding: 4px 4px 18px;
      border-bottom: 1px solid #262626; margin-bottom: 10px;
    }
    .sheet-cover {
      width: 48px; height: 48px; border-radius: 8px;
      object-fit: cover; background: #333;
    }
    .sheet-info { flex: 1; min-width: 0; }
    .sheet-title {
      font-size: 15px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sheet-artist {
      font-size: 12px; color: #b3b3b3; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sheet-action {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 8px; cursor: pointer;
      border-radius: 10px; transition: background 0.15s;
    }
    .sheet-action:active { background: #262626; }
    .sheet-action svg { width: 24px; height: 24px; fill: #fff; flex-shrink: 0; }
    .sheet-action .label { font-size: 15px; font-weight: 600; }
    .mini-player { touch-action: none; transition: transform 0.3s ease, opacity 0.3s ease; }
    .mini-player.hide { transform: translateY(120px); opacity: 0; pointer-events: none; }
    .full-player {
      position: fixed; inset: 0; z-index: 1000;
      background: linear-gradient(180deg, #1f1f1f 0%, #121212 60%);
      display: flex; flex-direction: column; align-items: center;
      padding: 14px 28px 40px; touch-action: none;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .full-player { clip-path: none; }
    .full-player.open { transform: translateY(0); clip-path: none; }
    .fp-handle { width: 40px; height: 4px; background: #444; border-radius: 999px; margin: 6px 0 20px; }
    .fp-cover { width: 100%; max-width: 340px; aspect-ratio: 1; border-radius: 16px; object-fit: cover; background: #333; margin-top: 16px; }
    .fp-title { font-size: 22px; font-weight: 800; margin-top: 28px; width: 100%; }
    .fp-artist { font-size: 15px; color: #b3b3b3; margin-top: 6px; width: 100%; }
    .fp-seek { width: 100%; margin-top: 28px; accent-color: #e91e63; }
    .fp-times { display: flex; justify-content: space-between; width: 100%; font-size: 11px; color: #888; margin-top: 4px; }
    .fp-play { margin-top: 28px; width: 70px; height: 70px; border-radius: 50%; background: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .fp-play svg { width: 30px; height: 30px; fill: #000; }
  </style>
</head>
<body>

  <nav class="top-tabs">
    <a href="index.html" class="active">Music</a>
    <a href="#">Album</a>
    <a href="#">Podcast</a>
    <a href="artists.html">Artist</a>
    <a href="#">Playlist</a>
  </nav>

  <section class="section">
    <div class="section-header">
      <h2>Top Songs</h2>
      <button class="refresh-btn" id="refresh-btn" style="display:none">↻ Refresh</button>
    </div>
    <div id="track-list">
      <div class="loading">Loading tracks…</div>
    </div>
  </section>

  <div class="mini-player" id="mini-player">
    <img class="mini-player-cover" id="player-cover"
         src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='46' height='46' viewBox='0 0 46 46'><rect width='46' height='46' fill='%23333'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='20' fill='%23888'>♪</text></svg>" alt="">
    <div class="mini-player-info">
      <div class="mini-player-title" id="player-title">No track playing</div>
      <div class="mini-player-artist" id="player-artist">—</div>
    </div>
    <button class="mini-play-btn" id="play-btn" aria-label="Play">
      <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="active">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
      Home
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.29 14.01l4.35 4.35 1.41-1.41-4.35-4.35A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
      Search
    </a>
    <a href="library.html">
      <svg viewBox="0 0 24 24"><path d="M4 4h5v2H6v12h3v2H4V4zm11 0h5v16h-5v-2h3V6h-3V4z"/></svg>
      Library
    </a>
    <a href="studio.html">
      <svg viewBox="0 0 24 24"><path d="M12 2l2 7h7l-5.5 4.5 2 7L12 16l-5.5 4.5 2-7L3 9h7z"/></svg>
      Studio
    </a>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="song-sheet" id="song-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <img class="sheet-cover" id="sheet-cover"
           src="https://via.placeholder.com/48/333/fff?text=♪" alt="">
      <div class="sheet-info">
        <div class="sheet-title" id="sheet-title">Song Title</div>
        <div class="sheet-artist" id="sheet-artist">Artist Name</div>
      </div>
    </div>

    <div class="sheet-action" id="sheet-download">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55l3.3-3.3 1.4 1.4L12 17.35 6.3 11.65l1.4-1.4 3.3 3.3V3h2zM5 19h14v2H5z"/></svg>
      <div class="label" id="download-label">Download</div>
    </div>

    <div class="sheet-action" id="sheet-share">
      <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 100-6 3 3 0 00-3 3c0 .24.04.47.09.7L8.04 9.81A3 3 0 103 12c0 1.66 1.34 3 3 3 .79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 105.92 0 2.92 2.92 0 00-2.92-2.92z"/></svg>
      <div class="label">Share</div>
    </div>
  </div>

  <div class="full-player" id="full-player">
    <div class="fp-handle"></div>
    <img class="fp-cover" id="fp-cover" src="" alt="">
    <div class="fp-title" id="fp-title">No track playing</div>
    <div class="fp-artist" id="fp-artist">—</div>
    <input class="fp-seek" id="fp-seek" type="range" min="0" max="100" value="0" step="0.1">
    <div class="fp-times"><span id="fp-cur">0:00</span><span id="fp-dur">0:00</span></div>
    <button class="fp-play" id="fp-play" aria-label="Play">
      <svg id="fp-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    
    const FALLBACK_COVER = 'https://via.placeholder.com/380/333/fff?text=♪';
    const PLAY_SVG  = '<path d="M8 5v14l11-7z"/>';
    const PAUSE_SVG = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

    let currentTrack = null;
    let isPlaying = false;
    let sheetTrack = null;

    const trackListEl  = document.getElementById('track-list');
    const audioEl      = document.getElementById('audio');
    const playBtn      = document.getElementById('play-btn');
    const playIcon     = document.getElementById('play-icon');
    const playerCover  = document.getElementById('player-cover');
    const playerTitle  = document.getElementById('player-title');
    const playerArtist = document.getElementById('player-artist');

    const sheetBackdrop = document.getElementById('sheet-backdrop');
    const songSheet     = document.getElementById('song-sheet');
    const sheetCover    = document.getElementById('sheet-cover');
    const sheetTitle    = document.getElementById('sheet-title');
    const sheetArtist   = document.getElementById('sheet-artist');
    const sheetDownload = document.getElementById('sheet-download');
    const sheetShare    = document.getElementById('sheet-share');
    const downloadLabel = document.getElementById('download-label');

    const refreshBtn = document.getElementById('refresh-btn');

    function setPlayIcon(playing) {
      playIcon.innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
    }

    async function loadTracks() {
      try {
        if (!trackListEl.querySelector('.track')) trackListEl.innerHTML = '<div class="loading">Loading tracks…</div>';

        const { data, error } = await db
          .from('tracks')
          .select('id, title, audio_url, cover_url, plays, artist_id, artists ( name )')
          .order('created_at', { ascending: false })
          .limit(30);

        if (error) throw error;

        if (!data || data.length === 0) {
          trackListEl.innerHTML = '<div class="empty">🎵 No tracks yet. Upload your first song in the Artist Studio!</div>';
          return;
        }

        trackListEl.innerHTML = '';
        data.forEach(track => {
          const artistName = track.artists?.name || 'Unknown Artist';
          const cover = track.cover_url || FALLBACK_COVER;

          const el = document.createElement('div');
          el.className = 'track';
          el.dataset.id = track.id;
          el.innerHTML = `
            <img class="track-cover" src="${cover}"
                 onerror="this.src='${FALLBACK_COVER}'" alt="">
            <div class="track-info">
              <div class="track-title">${track.title}</div>
              <div class="track-artist">${artistName}</div>
            </div>
            <button class="track-menu-btn" aria-label="More">
              <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 100-4 2 2 0 000 4zm0 6a2 2 0 100-4 2 2 0 000 4zm0 6a2 2 0 100-4 2 2 0 000 4z"/></svg>
            </button>
          `;

          el.addEventListener('click', (e) => {
            if (e.target.closest('.track-menu-btn')) return;
            playTrack(track, artistName, cover, el);
          });

          el.querySelector('.track-menu-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            openSongSheet(track, artistName, cover);
          });

          trackListEl.appendChild(el);
        });
      } catch (err) {
        console.error(err);
        trackListEl.innerHTML = '<div class="empty">⚠️ Could not load tracks: ' + err.message + '</div>';
      }
    }

    function playTrack(track, artistName, cover, el) {
      if (!track.audio_url) { alert('No audio file for this track.'); return; }

      document.querySelectorAll('.track').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');

      currentTrack = track;
      try { localStorage.setItem('dropplay_last', JSON.stringify({ track: track, artistName: artistName, cover: cover })); localStorage.setItem('dropplay_time', '0'); } catch (e) {}
      audioEl.src = track.audio_url;
      audioEl.play();
      isPlaying = true;

      playerCover.src = cover;
      playerTitle.textContent  = track.title;
      playerArtist.textContent = artistName;
      setPlayIcon(true);

      if (track.id) {
        db.from('tracks').update({ plays: (track.plays || 0) + 1 })
          .eq('id', track.id).then(() => {});
      }
    }

    function openSongSheet(track, artistName, cover) {
      sheetTrack = track;
      sheetCover.src = cover;
      sheetTitle.textContent  = track.title;
      sheetArtist.textContent = artistName;

      // Show "Downloaded ✓" if already saved
      try {
        const existing = JSON.parse(localStorage.getItem('dropplay_downloads') || '[]');
        const already = existing.some(t => t.id === track.id);
        downloadLabel.textContent = already ? 'Downloaded ✓' : 'Download';
      } catch (e) {
        downloadLabel.textContent = 'Download';
      }

      songSheet.classList.add('open');
      sheetBackdrop.classList.add('open');
    }
    function closeSongSheet() {
      songSheet.classList.remove('open');
      sheetBackdrop.classList.remove('open');
    }
    sheetBackdrop.addEventListener('click', closeSongSheet);

    // ===== DOWNLOAD → save to app Library (no phone files) =====
    sheetDownload.addEventListener('click', () => {
      if (!sheetTrack) return;

      try {
        const existing = JSON.parse(localStorage.getItem('dropplay_downloads') || '[]');
        const already = existing.some(t => t.id === sheetTrack.id);

        if (already) {
          alert('Already in your Library ✓');
        } else {
          existing.push({
            id: sheetTrack.id,
            title: sheetTrack.title,
            artist_name: sheetArtist.textContent,
            audio_url: sheetTrack.audio_url,
            cover_url: sheetTrack.cover_url,
            artist_id: sheetTrack.artist_id,
            downloaded_at: Date.now()
          });
          localStorage.setItem('dropplay_downloads', JSON.stringify(existing));
          alert('Saved to Library ✓');
          downloadLabel.textContent = 'Downloaded ✓';
        }
      } catch (e) {
        console.error(e);
        alert('Could not save: ' + e.message);
      }

      closeSongSheet();
    });

    // Share
    sheetShare.addEventListener('click', async () => {
      if (!sheetTrack) return;
      const url = window.location.origin + '/artist.html?id=' + (sheetTrack.artist_id || '');
      try {
        if (navigator.share) {
          await navigator.share({
            title: sheetTrack.title,
            text: 'Listen to "' + sheetTrack.title + '" on Dropplay',
            url
          });
        } else {
          await navigator.clipboard.writeText(url);
          alert('Link copied!');
        }
      } catch (e) {}
      closeSongSheet();
    });

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!currentTrack) return;
      if (isPlaying) { audioEl.pause(); setPlayIcon(false); }
      else           { audioEl.play();  setPlayIcon(true);  }
      isPlaying = !isPlaying;
    });

    audioEl.addEventListener('ended', () => {
      setPlayIcon(false);
      isPlaying = false;
    });

    refreshBtn.addEventListener('click', loadTracks);

    // ===== BIG PLAYER =====
    const fullPlayer = document.getElementById('full-player');
    const miniPlayer = document.getElementById('mini-player');
    const fpCover = document.getElementById('fp-cover');
    const fpTitle = document.getElementById('fp-title');
    const fpArtist = document.getElementById('fp-artist');
    const fpSeek = document.getElementById('fp-seek');
    const fpCur = document.getElementById('fp-cur');
    const fpDur = document.getElementById('fp-dur');
    const fpPlay = document.getElementById('fp-play');
    const fpIcon = document.getElementById('fp-icon');
    let fpOpen = false;
    let justDragged = false;

    function fmtTime(s) {
      if (!s || isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const r = Math.floor(s % 60);
      return m + ':' + (r < 10 ? '0' : '') + r;
    }

    function syncFull() {
      fpCover.src = playerCover.src;
      fpTitle.textContent = playerTitle.textContent;
      fpArtist.textContent = playerArtist.textContent;
      fpIcon.innerHTML = audioEl.paused ? PLAY_SVG : PAUSE_SVG;
      fpCur.textContent = fmtTime(audioEl.currentTime);
      fpDur.textContent = fmtTime(audioEl.duration);
      if (audioEl.duration) fpSeek.value = (audioEl.currentTime / audioEl.duration) * 100;
    }
    ['play', 'pause', 'loadedmetadata', 'timeupdate', 'ended'].forEach(ev => audioEl.addEventListener(ev, syncFull));

    fpSeek.addEventListener('input', () => {
      if (audioEl.duration) audioEl.currentTime = (fpSeek.value / 100) * audioEl.duration;
    });
    fpPlay.addEventListener('click', () => playBtn.click());

    function setOrigin() {
      const b = playBtn.getBoundingClientRect();
      fullPlayer.style.setProperty('--px', (b.left + b.width / 2) + 'px');
      fullPlayer.style.setProperty('--py', (b.top + b.height / 2) + 'px');
    }
    function setFull(open) {
      fpOpen = open;
      setOrigin();
      fullPlayer.style.transition = '';
      fullPlayer.style.transform = '';
      miniPlayer.style.transition = '';
      miniPlayer.style.transform = '';
      miniPlayer.style.opacity = '';
      miniPlayer.classList.toggle('hide', open);
      fullPlayer.classList.toggle('open', open);
      if (open) syncFull();
    }
    function oldSetFull(open) {
      fpOpen = open;
      fullPlayer.style.transition = '';
      fullPlayer.style.transform = '';
      fullPlayer.classList.toggle('open', open);
      if (open) syncFull();
    }

    function addDrag(el) {
      let startY = 0, dy = 0, dragging = false, moved = false;
      el.addEventListener('touchstart', e => {
        if (e.target.closest('input')) return;
        if (!fpOpen && !currentTrack) return;
        startY = e.touches[0].clientY;
        dy = 0; moved = false; dragging = true;
        fullPlayer.style.transition = 'none';
        if (!fpOpen) syncFull();
      }, { passive: true });
      el.addEventListener('touchmove', e => {
        if (!dragging) return;
        dy = e.touches[0].clientY - startY;
        if (Math.abs(dy) > 6) moved = true;
        const h = window.innerHeight;
                const pos = fpOpen ? Math.max(0, dy) : Math.max(0, (h - 68 - miniPlayer.offsetHeight) + dy);
        const b = playBtn.getBoundingClientRect();
        const R = Math.hypot(window.innerWidth, h);
        const prog = Math.max(0, Math.min(1, fpOpen ? 1 - Math.max(0, dy) / (h * 0.6) : -dy / (h * 0.6)));
        fullPlayer.style.transform = 'translateY(' + Math.min(pos, h) + 'px)';
        const p = 1 - Math.min(pos, h) / h;
        miniPlayer.style.transition = 'none';
        miniPlayer.style.transform = 'translateY(' + (p * 120) + 'px)';
        miniPlayer.style.opacity = String(1 - p);
      }, { passive: true });
      el.addEventListener('touchend', () => {
        if (!dragging) return;
        dragging = false;
        if (moved) {
          justDragged = true;
          setTimeout(() => { justDragged = false; }, 300);
          setFull(fpOpen ? !(dy > 80) : dy < -60);
        } else {
          setFull(fpOpen);
        }
      }, { passive: true });
    }
    addDrag(miniPlayer);
    addDrag(fullPlayer);

    miniPlayer.addEventListener('click', () => {
      if (justDragged || !currentTrack) return;
      fullPlayer.style.transition = 'none';
      fullPlayer.style.transform = 'translateY(' + miniPlayer.getBoundingClientRect().top + 'px)';
      void fullPlayer.offsetHeight;
      setFull(true);
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadTracks();
    });
    // reload on focus removed: it ate the first tap

    // bring back the last played song
    try {
      const last = JSON.parse(localStorage.getItem('dropplay_last') || 'null');
      if (last && last.track && last.track.audio_url) {
        currentTrack = last.track;
        audioEl.src = last.track.audio_url;
        playerCover.src = last.cover;
        playerTitle.textContent = last.track.title;
        playerArtist.textContent = last.artistName;
        setPlayIcon(false);
        isPlaying = false;
        const t = parseFloat(localStorage.getItem('dropplay_time') || '0');
        audioEl.addEventListener('loadedmetadata', () => {
          if (t > 0 && t < audioEl.duration - 1) audioEl.currentTime = t;
        }, { once: true });
      }
    } catch (e) {}
    audioEl.addEventListener('timeupdate', () => {
      try { localStorage.setItem('dropplay_time', String(audioEl.currentTime)); } catch (e) {}
    });

    loadTracks();
  </script>
</body>
</html>
