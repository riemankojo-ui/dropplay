name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Copy web files
        run: |
          mkdir -p www
          cp index.html app.js config.js styl.css manifest.json icon-192.png icon-512.png www/
      - run: npx cap add android
      - name: Use the Dropplay icon
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
          done
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dropplay-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
